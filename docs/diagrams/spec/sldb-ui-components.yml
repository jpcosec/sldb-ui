id: sldb-ui.components
title: SLDB UI Component Architecture
type: component
version: "0.1"

data:
  nodes:
    SldbUi:
      label: "@sldb/ui"
      kind: core
      contains:
        - WorkspaceShell
        - DocumentNavigator
        - SourceEditor
        - RenderedDocumentView
        - StructureInspector
        - ActionToolbar
        - MarcadoAdapter
        - SldbAdapter
        - GitAdapter

    WorkspaceShell:
      label: Workspace Shell
      kind: core

    DocumentNavigator:
      label: Document Navigator
      kind: ui

    SourceEditor:
      label: Source Editor
      kind: ui

    RenderedDocumentView:
      label: Rendered Document View
      kind: ui

    StructureInspector:
      label: Structure Inspector
      kind: ui

    ActionToolbar:
      label: Action Toolbar
      kind: ui

    MarcadoAdapter:
      label: Marcado Adapter
      kind: boundary

    SldbAdapter:
      label: SLDB Adapter
      kind: boundary

    GitAdapter:
      label: Git Adapter
      kind: boundary

    MarcadoRuntime:
      label: "@marcado/ runtime"
      kind: boundary

    SldbRuntime:
      label: "@sldb/ runtime"
      kind: boundary

    Git:
      label: Git
      kind: boundary

    MarkdownFiles:
      label: Markdown Files
      kind: database

    LocalDrafts:
      label: local drafts
      kind: database

  edges:
    - from: WorkspaceShell
      to: DocumentNavigator
      relation: contains
      label: navigation

    - from: WorkspaceShell
      to: SourceEditor
      relation: contains
      label: source editing

    - from: WorkspaceShell
      to: RenderedDocumentView
      relation: contains
      label: rendered reading

    - from: WorkspaceShell
      to: StructureInspector
      relation: contains
      label: structure inspection

    - from: WorkspaceShell
      to: ActionToolbar
      relation: contains
      label: user actions

    - from: SourceEditor
      to: MarcadoAdapter
      relation: uses
      label: parse / source map

    - from: RenderedDocumentView
      to: MarcadoAdapter
      relation: uses
      label: rendered model

    - from: StructureInspector
      to: MarcadoAdapter
      relation: uses
      label: markers / structure

    - from: ActionToolbar
      to: SldbAdapter
      relation: uses
      label: validate / track / compose

    - from: ActionToolbar
      to: GitAdapter
      relation: uses
      label: diff / history / restore

    - from: MarcadoAdapter
      to: MarcadoRuntime
      relation: delegates
      label: canonical interpretation

    - from: SldbAdapter
      to: SldbRuntime
      relation: delegates
      label: semantic document ops

    - from: GitAdapter
      to: Git
      relation: delegates
      label: temporal history

    - from: SourceEditor
      to: MarkdownFiles
      relation: reads_writes
      label: open / save

    - from: SourceEditor
      to: LocalDrafts
      relation: reads_writes
      label: draft persistence

    - from: SldbRuntime
      to: MarkdownFiles
      relation: reads_writes
      label: tracked docs

    - from: Git
      to: MarkdownFiles
      relation: reads_writes
      label: versioned files
